<!DOCTYPE html>
<html>
<head>
<title>🎅 Secret Santa - Christmas Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  background: linear-gradient(180deg, #0a3d2e 0%, #8B0000 100%);
  min-height: 100vh; margin:0; font-family: Arial; color:white;
  text-align:center; overflow-x:hidden;
}
.snow { position:fixed; top:-10px; color:#fff; font-size:20px; animation: fall linear infinite; pointer-events:none; }
@keyframes fall { to { transform: translateY(105vh); } }
.box {
  background:white; color:black; max-width:500px; margin:30px auto;
  padding:30px; border-radius:25px; border:4px solid gold;
  box-shadow: 0 0 30px rgba(255,215,0,0.6);
}
h1 { color:#c0392b; }
input { width:90%; padding:12px; margin:8px; border-radius:10px; border:2px solid #c0392b; }
button {
  background:#c0392b; color:white; padding:12px 30px; border:none;
  border-radius:20px; font-size:18px; font-weight:bold; cursor:pointer; margin-top:10px;
}
button:hover { background: green; }
</style>
</head>
<body>

<div class="snow" style="left:10%; animation-duration:8s;">❄️</div>
<div class="snow" style="left:25%; animation-duration:10s;">🎄</div>
<div class="snow" style="left:40%; animation-duration:12s;">❄️</div>
<div class="snow" style="left:60%; animation-duration:9s;">🎅</div>
<div class="snow" style="left:75%; animation-duration:11s;">⭐</div>
<div class="snow" style="left:90%; animation-duration:7s;">🎁</div>

<h1>🎄 MERRY CHRISTMAS 🎅</h1>
<h2>Secret Santa Generator</h2>

<div class="box">
  <h3>🎁 Add Names</h3>
  <form method="POST" action="/">
    <input type="text" name="names" placeholder="Enter names with comma - ex: Dhanam, Blaze, Abi" required>
    <br>
    <button type="submit">🎅 Generate Secret Santa 🎄</button>
  </form>
  {% if result %}
  <hr>
  <h3>{{ result }}</h3>
  {% endif %}
</div>

<p style="color:gold;">✨ Christmas Eve ku munaadi play pannunga! ✨</p>

</body>
</html>
