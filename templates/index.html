<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Santa</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: url('/static/bg.jpg') no-repeat center center fixed;
    background-size: cover;
    font-family: system-ui, sans-serif;
  }
  body::after{content:""; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:0;}
  .snow{position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; font-size:18px;}
  .card{
    position:relative; z-index:2; width:92%; max-width:400px;
    background:rgba(15,15,15,0.88); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:28px; padding:26px; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  h1{color:white; margin:0 0 18px; font-size:26px;}
  input{width:100%; padding:15px; border-radius:14px; border:none; font-size:16px; margin-bottom:12px; background:#222; color:white;}
  input::placeholder{color:#999;}
  .btn-red{width:100%; padding:14px; border-radius:14px; border:none; background:#ff2a2a; color:white; font-size:17px; font-weight:800; cursor:pointer;}
  .btn-green{width:100%; padding:14px; border-radius:14px; border:none; background:#1db954; color:white; font-size:17px; font-weight:800; cursor:pointer; margin-top:10px;}
  .code{background:#ff2a2a; color:white; padding:12px; border-radius:14px; font-weight:800; letter-spacing:2px; font-size:20px; margin-bottom:14px;}
  .member{background:rgba(255,255,255,0.08); color:white; padding:10px 14px; border-radius:12px; margin:7px 0; text-align:left;}
  .reveal-name{color:#ff3b3b; font-size:38px; font-weight:900; margin:16px 0 6px;}
  .small-msg{color:#ffd6e0; font-size:14px; line-height:1.5;}
</style>
</head>
<body>
<div class="snow">❄️ ⛄ 🎄 🎅 ❄️ ⛄ 🎄 🎅</div>
<div class="card" id="app">Loading...</div>
<script>
let myName=localStorage.getItem('santa_name')||'';
let roomCode=new URLSearchParams(location.search).get('code')||'';
async function api(p,b){let r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});return r.json();}
function showLogin(){
  document.getElementById('app').innerHTML=`<h1>🎅 Secret Santa</h1><input id="n" placeholder="Name" value="${myName}"><button class="btn-red" onclick="doLogin()">Login</button><div style="margin-top:16px">⛄ 🎄 🎅</div>`;
}
async function doLogin(){
  let v=document.getElementById('n').value.trim(); if(!v) return;
  myName=v; localStorage.setItem('santa_name',v);
  await api('/api/login',{name:v});
  if(roomCode) join(roomCode); else showHome();
}
function showHome(){
  document.getElementById('app').innerHTML=`<h1>🎅 Secret Santa</h1><button class="btn-red" onclick="create()">Create Group</button><div style="color:#aaa;margin:12px 0">or</div><input id="c" placeholder="Enter Code"><button class="btn-green" onclick="join(document.getElementById('c').value)">Join Group</button>`;
}
async function create(){let d=await api('/api/create-room',{}); roomCode=d.code; history.pushState({},'','?code='+roomCode); load();}
async function join(code){if(!code) return; roomCode=code.toUpperCase(); history.pushState({},'','?code='+roomCode); await api('/api/join-room',{code:roomCode}); load();}
async function load(){
  let d=await fetch('/api/get-room?code='+roomCode).then(r=>r.json());
  if(d.error){showHome(); return;}
  let mems=d.members.map(m=>`<div class="member">${m} ${m==d.creator?'👑':''}</div>`).join('');
  let btn=d.is_creator?`<button class="btn-green" onclick="shuffle()">Start Shuffle 🎲</button>`:`<div style="color:#888;margin-top:10px">Waiting for creator...</div>`;
  let reveal='';
  if(d.assigned){
    reveal=`<div style="margin-top:18px;border-top:1px solid rgba(255,255,255,0.12);padding-top:16px"><div class="reveal-name">${d.assigned}</div><div class="small-msg">🎁 Gift ready pannu da!<br>Yaar kitayum sollatha da 🤫<br>Merry Christmas! 🎄❤️</div></div>`;
  }
  document.getElementById('app').innerHTML=`<h1>🎅 Secret Santa</h1><div class="code">Code: ${roomCode}</div>${mems}${btn}${reveal}`;
  if(!d.assigned) setTimeout(load,3000);
}
async function shuffle(){await api('/api/shuffle-room',{code:roomCode}); load();}
if(!myName) showLogin(); else {showHome(); if(roomCode) load();}
</script>
</body>
</html>
