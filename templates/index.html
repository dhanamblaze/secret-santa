<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Santa - Christmas Edition</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    /* FINAL CHRISTMAS BACKGROUND - INI MATHA KUDATHU */
    background: linear-gradient(180deg, rgba(11,61,46,0.9) 0%, rgba(139,0,0,0.9) 100%), 
                url('https://images.unsplash.com/photo-1513297887119-d46091b24bfa');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    background: rgba(255,255,255,0.95);
    color: #222;
    padding: 35px;
    border-radius: 20px;
    width: 90%;
    max-width: 500px;
    text-align: center;
    border: 4px solid gold;
    box-shadow: 0 0 30px gold;
  }
  h1 { color: #c0392b; margin:0; }
  .sub { color: gold; font-weight: bold; font-size: 20px; margin: 10px 0 20px 0; }
  input { width: 90%; padding: 12px; border-radius: 10px; border: 2px solid #c0392b; margin: 5px; }
  button { background: #c0392b; color: white; border: none; padding: 12px 25px; border-radius: 20px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
  button:hover { background: #0b3d2e; }
</style>
</head>
<body>
<div class="container">
  <h1>🎅 Secret Santa</h1>
  <div class="sub">🎄 MERRY CHRISTMAS 🎄</div>
  
  <form method="POST">
    <input type="text" name="names" placeholder="Names with comma - Dhanam, Blaze, Abi" required>
    <br>
    <button type="submit">Generate 🎁</button>
  </form>

  {% if result %}
    <hr>
    <div style="text-align:left; background:#fff3cd; padding:15px; border-radius:10px; margin-top:15px;">
      {{ result | safe }}
    </div>
  {% endif %}

  <p style="margin-top:20px; font-size:12px; color:#666;">✨ Christmas Special Edition ✨</p>
</div>
</body>
</html>
